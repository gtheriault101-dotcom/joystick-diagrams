<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1966CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D4AA6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" fill="url(#grad1)"/>
  
  <!-- BMS Text -->
  <text x="128" y="140" font-size="80" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">BMS</text>
  
  <!-- Falcon silhouette -->
  <g transform="translate(128, 40) scale(0.4)">
    <!-- Falcon body -->
    <ellipse cx="0" cy="0" rx="30" ry="50" fill="white" opacity="0.3"/>
    <!-- Falcon head -->
    <circle cx="0" cy="-45" r="15" fill="white" opacity="0.3"/>
  </g>
</svg>